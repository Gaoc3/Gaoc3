name: Refresh Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Stats SVGs
        run: |
          python -c "
          import urllib.request, os
          os.makedirs('assets', exist_ok=True)
          urls = {
              'assets/github-stats.svg': 'https://github-readme-stats-eight-theta.vercel.app/api?username=Gaoc3&show_icons=true&theme=tokyonight&hide_border=true&count_private=true',
              'assets/top-langs.svg': 'https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=Gaoc3&layout=compact&theme=tokyonight&hide_border=true',
              'assets/streak-stats.svg': 'https://streak-stats.demolab.com?user=Gaoc3&theme=tokyonight&hide_border=true'
          }
          headers = {'User-Agent': 'Mozilla/5.0'}
          for path, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if resp.status == 200:
                          data = resp.read()
                          with open(path, 'wb') as f:
                              f.write(data)
                          print(f'Successfully updated {path}')
              except Exception as e:
                  print(f'Failed to fetch {url}: {e}')
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore: refresh profile stats SVGs [skip ci]"
            git push
          fi
